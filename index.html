<!DOCTYPE html>
<html>
<head>
<title>DarkOS Black Market</title>

<style>
body{
margin:0;
background:#050505;
color:#00ff99;
font-family:monospace;
overflow:hidden;
}

#top{
height:45px;
display:flex;
align-items:center;
padding:10px;
border-bottom:1px solid rgba(0,255,153,0.2);
letter-spacing:3px;
}

#wrap{
display:flex;
height:calc(100vh - 45px);
}

#left{
width:30%;
border-right:1px solid rgba(0,255,153,0.2);
padding:10px;
}

#right{
flex:1;
padding:10px;
}

.node{
padding:8px;
margin:5px 0;
border:1px solid rgba(0,255,153,0.2);
cursor:pointer;
}

.node:hover{
background:rgba(0,255,153,0.05);
}

#terminal{
height:320px;
border:1px solid rgba(0,255,153,0.2);
padding:10px;
overflow:auto;
background:black;
}

input{
width:100%;
padding:8px;
background:black;
color:#00ff99;
border:1px solid rgba(0,255,153,0.3);
outline:none;
}

button{
margin-top:10px;
width:100%;
padding:6px;
background:black;
color:#00ff99;
border:1px solid rgba(0,255,153,0.3);
cursor:pointer;
}

.small{
opacity:0.7;
font-size:12px;
margin-top:10px;
}
</style>

</head>
<body>

<div id="top">DARKOS // DARK WEB NETWORK</div>

<div id="wrap">

<div id="left">
<h3>NETWORK</h3>
<div id="nodes"></div>

<button onclick="refreshNetwork()">REFRESH NETWORK</button>

<div class="small" id="status"></div>
</div>

<div id="right">
<h3>TERMINAL</h3>
<div id="terminal"></div>

<input id="cmd" placeholder="scan / hack / ls / mission / accept / complete / shop / buy">
</div>

</div>

<script>

/* NETWORK */
const network={
"A":{ip:"10.0.0.1",security:1,files:["log.txt","data.cache"],owner:"system"},
"B":{ip:"192.168.0.1",security:3,files:["bank.db","vault.key"],owner:"system"},
"C":{ip:"172.16.0.5",security:2,files:["archive.zip","users.db"],owner:"system"}
};

/* STATE */
let current="A";
let hacked=false;
let trace=0;
let money=0;
let inventory=[];
let isAdmin=false;

/* MISSIONS */
let missions=[
{id:1,text:"Hack any node",reward:200,done:false},
{id:2,text:"Steal a file",reward:150,done:false},
{id:3,text:"Decrypt data",reward:250,done:false}
];

let activeMission=null;

/* SHOP */
let shop={
"speed":200,
"stealth":300,
"decryptor":400
};

/* LOG */
function log(t){
let time=new Date().toLocaleTimeString();
document.getElementById("terminal")
.innerHTML+="<div>["+time+"] "+t+"</div>";
}

/* RENDER */
function render(){
let box=document.getElementById("nodes");
box.innerHTML="";

for(let n in network){
let d=document.createElement("div");
d.className="node";
d.innerHTML=network[n].ip;

d.onclick=()=>{
current=n;
log("connected → "+network[n].ip);
};

box.appendChild(d);
}
}

/* REFRESH */
function refreshNetwork(){
for(let n in network){
network[n].ip =
"10."+
Math.floor(Math.random()*255)+"."+
Math.floor(Math.random()*255)+"."+
Math.floor(Math.random()*255);
}
render();
log("network updated");
}

/* STATUS */
function status(){
document.getElementById("status").innerText=
"NODE:"+network[current].ip+
" | $"+money+
" | TRACE:"+trace+"%";
}

/* TRACE */
setInterval(()=>{
if(hacked){
trace++;
if(trace>=99){
trace=0;
hacked=false;
log("⚡ TRACE RESET");
}
}
},4000);

/* COMMANDS */
document.getElementById("cmd").addEventListener("keydown",e=>{
if(e.key==="Enter"){
handle(e.target.value);
e.target.value="";
status();
}
});

function handle(c){
let a=c.split(" ");
let node=network[current];

/* SCAN */
if(c==="scan"){
for(let n in network){
log(network[n].ip);
}
}

/* HACK */
if(c==="hack"){
hacked=true;
node.owner="YOU";
money+=50;
log("node hacked");

/* mission progress */
if(activeMission && activeMission.id===1){
completeMission();
}
}

/* LS */
if(c==="ls"){
if(!hacked) return log("ACCESS DENIED");
node.files.forEach(f=>log(f));
}

/* STEAL */
if(a[0]==="steal"){
if(!hacked) return log("ACCESS DENIED");
inventory.push(a[1]);
money+=50;
log("stolen");

/* mission */
if(activeMission && activeMission.id===2){
completeMission();
}
}

/* DECRYPT */
if(a[0]==="decrypt"){
if(!hacked) return log("ACCESS DENIED");
money+=100;
log("decrypted");

/* mission */
if(activeMission && activeMission.id===3){
completeMission();
}
}

/* MISSIONS LIST */
if(c==="mission"){
missions.forEach(m=>{
if(!m.done) log(m.id+": "+m.text+" ($"+m.reward+")");
});
}

/* ACCEPT */
if(a[0]==="accept"){
let m=missions.find(x=>x.id==a[1] && !x.done);
if(m){
activeMission=m;
log("mission accepted: "+m.text);
}
}

/* COMPLETE */
function completeMission(){
activeMission.done=true;
money+=activeMission.reward;
log("✔ mission complete +$"+activeMission.reward);
activeMission=null;
}

/* SHOP */
if(c==="shop"){
for(let i in shop){
log(i+" - $"+shop[i]);
}
}

/* BUY */
if(a[0]==="buy"){
let item=a[1];
if(shop[item]){
if(money>=shop[item]){
money-=shop[item];
log("bought "+item);
}else{
log("not enough money");
}
}
}

}

/* INIT */
render();
status();
log("DarkOS online...");

</script>

</body>
</html>
