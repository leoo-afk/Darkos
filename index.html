<!DOCTYPE html>
<html>
<head>
<title>DarkOS MMO Lite</title>

<style>
body{
margin:0;
background:#050505;
color:#00ff99;
font-family:monospace;
overflow:hidden;
}

#top{
padding:10px;
border-bottom:1px solid rgba(0,255,153,0.2);
letter-spacing:3px;
}

#wrap{
display:flex;
height:calc(100vh - 40px);
}

#left{
width:30%;
border-right:1px solid rgba(0,255,153,0.2);
padding:10px;
}

#right{
flex:1;
padding:10px;
}

.node{
padding:6px;
margin:5px 0;
border:1px solid rgba(0,255,153,0.2);
cursor:pointer;
}

#terminal{
height:300px;
border:1px solid rgba(0,255,153,0.2);
padding:10px;
overflow:auto;
background:black;
}

input{
width:100%;
padding:8px;
background:black;
color:#00ff99;
border:1px solid rgba(0,255,153,0.3);
}

button{
width:100%;
margin-top:8px;
background:black;
color:#00ff99;
border:1px solid rgba(0,255,153,0.3);
}
</style>

</head>
<body>

<div id="top">DARKOS // MMO LITE</div>

<div id="wrap">

<div id="left">
<h3>NETWORK</h3>
<div id="nodes"></div>

<button onclick="refreshNetwork()">REFRESH</button>

<div id="status"></div>
</div>

<div id="right">
<h3>TERMINAL</h3>
<div id="terminal"></div>

<input id="cmd" placeholder="register / login / hack / top">
</div>

</div>

<script>

/* NETWORK */
let network={
"A":{ip:"10.0.0.1"},
"B":{ip:"192.168.0.1"},
"C":{ip:"172.16.0.5"}
};

/* STATE */
let current="A";
let user=null;
let money=0;

/* DATABASE (LOCAL MMO) */
let db = JSON.parse(localStorage.getItem("darkos_mmo")||"{}");

/* LOG */
function log(t){
document.getElementById("terminal").innerHTML+="<div>"+t+"</div>";
}

/* SAVE */
function save(){
localStorage.setItem("darkos_mmo",JSON.stringify(db));
}

/* RENDER */
function render(){
let box=document.getElementById("nodes");
box.innerHTML="";

for(let n in network){
let d=document.createElement("div");
d.className="node";
d.innerHTML=network[n].ip;

d.onclick=()=>{
current=n;
log("connected → "+network[n].ip);
};

box.appendChild(d);
}
}

/* REFRESH */
function refreshNetwork(){
for(let n in network){
network[n].ip="10."+Math.random()*255|0+"."+Math.random()*255|0+"."+Math.random()*255|0;
}
render();
log("network refreshed");
}

/* STATUS */
function status(){
document.getElementById("status").innerText=
(user?user:"guest")+" | $"+money;
}

/* COMMANDS */
document.getElementById("cmd").addEventListener("keydown",e=>{
if(e.key==="Enter"){
handle(e.target.value);
e.target.value="";
status();
}
});

function handle(c){
let a=c.split(" ");

/* REGISTER */
if(a[0]==="register"){
if(db[a[1]]){
log("user exists");
}else{
db[a[1]]={pass:a[2],money:0};
save();
log("registered");
}
}

/* LOGIN */
if(a[0]==="login"){
let u=db[a[1]];
if(u && u.pass===a[2]){
user=a[1];
money=u.money;
log("logged in");
}else{
log("login failed");
}
}

/* HACK */
if(c==="hack"){
if(!user) return log("login first");
money+=50;
db[user].money=money;
save();
log("hack success +$50");
}

/* LEADERBOARD */
if(c==="top"){
let top=Object.entries(db)
.sort((a,b)=>b[1].money-a[1].money)
.slice(0,5);

log("=== TOP HACKERS ===");
top.forEach(p=>{
log(p[0]+" | $"+p[1].money);
});
}

}

/* INIT */
render();
status();
log("DarkOS MMO Lite online");

</script>

</body>
</html>
